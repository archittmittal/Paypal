# Render Blueprint: the API web service, the web app and their Postgres database.
# Deploy: Render dashboard > New > Blueprint > pick this repo. Full guide: docs/deployment-render.md.
# Secrets are never in this file: every `sync: false` value is entered in the dashboard on first deploy
# (Render ignores `sync: false` variables on later Blueprint syncs).
# Spec: https://render.com/docs/blueprint-spec   Validate: render blueprints validate render.yaml
#
# Database credentials are split (docs/deployment-render.md, "Database and migrations"):
#   - The database owner (the user Render creates with mandate-db) runs migrations and owns every table. Its URL is
#     used ONLY by the operator commands `pnpm db:migrate` / `db:roles` / `db:seed`, from a trusted machine, as
#     MIGRATION_DATABASE_URL. It is never set on mandate-api.
#   - mandate-api logs in as the restricted role created by `pnpm db:roles` (member of mandate_runtime only).
#     So DATABASE_URL is NOT `fromDatabase: connectionString`, which would hand the API the owner's password.
# Migrations do not run on boot. The free instance type has no preDeployCommand (paid only), and even on a paid
# plan a preDeployCommand shares this service's environment, so the owner's URL would sit in the API's runtime.
# Instead the API refuses to start unless the database has exactly its migrations, or is only ahead of it (migrated
# for the next release), and its login is least-privilege (apps/api/src/db/startup.ts). A refused start fails the
# deploy and Render keeps the previous version serving. After running `pnpm db:migrate`, trigger a Manual Deploy.

services:
  - type: web
    name: mandate-api
    runtime: node
    plan: free
    region: singapore
    # pnpm comes from the packageManager field in package.json via corepack. No build step: the API runs its
    # TypeScript sources through Node's type stripping (Node >= 22.18).
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @mandate/api start
    # Liveness only (no database, no PayPal call). Readiness with the database check is /ready. The start-up gate
    # already refuses a missing or incompatible database before the server listens.
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Node 22.18+ strips TypeScript types by default; the API runs from source (apps/api, PR #30).
      - key: NODE_VERSION
        value: 24.16.0
      # Fail-closed configuration: DATABASE_URL required, owner credentials refused, least-privilege login enforced.
      - key: NODE_ENV
        value: production
      # Render routes traffic to 0.0.0.0:$PORT (Render sets PORT); the API defaults to loopback otherwise.
      - key: HOST
        value: 0.0.0.0
      # The web app's origin, e.g. https://mandate-web.onrender.com (comma-separate several). Unset: no CORS.
      - key: WEB_ORIGIN
        sync: false
      # Approvals through Zapier (docs/zapier.md): the Catch Hook URL, and the web app URL for review links.
      - key: ZAPIER_APPROVAL_WEBHOOK_URL
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: LOG_LEVEL
        value: info
      # mandate-db's INTERNAL URL with the user and password of the restricted login from `pnpm db:roles`:
      # postgresql://mandate_app:<password>@<internal host>/mandate  (docs/deployment-render.md, step 6).
      - key: DATABASE_URL
        sync: false
      # PayPal sandbox app credentials (packages/payments is sandbox-only; there is no live setting).
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_RETURN_URL
        sync: false
      - key: PAYPAL_CANCEL_URL
        sync: false
      # Id of the webhook registered on the sandbox app for https://<service>/webhooks/paypal. Without it the
      # webhook route is not registered; the reconcile job still settles orders by polling PayPal.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # LLM provider key (packages/llm).
      - key: ANTHROPIC_API_KEY
        sync: false

  # The web app (apps/web): a static Vite build. VITE_* values are compiled into public JavaScript, so they
  # must never hold a secret. Set WEB_ORIGIN on mandate-api to this site's URL. VERIFY on first deploy.
  - type: web
    name: mandate-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @mandate/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      # The API's public URL, e.g. https://mandate-api.onrender.com
      - key: VITE_API_URL
        sync: false
      - key: VITE_MANDATE_ID
        value: 00000000-0000-4000-8000-000000000021

databases:
  - name: mandate-db
    plan: free
    region: singapore
    databaseName: mandate
    user: mandate
    postgresMajorVersion: "17"
    # Free plan: expires 30 days after creation, no backups, one per workspace (docs/deployment-render.md).
    # `user` is the owner role: it runs migrations and must never be the API's login.
    # No external connections ([] blocks every external IP; internal connections from services in this region are
    # unaffected). For an operator migration, add your own IP/32 temporarily in the dashboard (Access Control), run
    # the command, then remove it again yourself.
    ipAllowList: []
