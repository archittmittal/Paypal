# Local development services. Start with: docker compose up -d
# Credentials below are for a throwaway local database only; real ones live in Render env vars.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mandate
      POSTGRES_PASSWORD: mandate
      POSTGRES_DB: mandate
    ports:
      # Loopback only: the database is never reachable from the network. POSTGRES_PORT picks another host port
      # when 5432 is taken (then use that port in DATABASE_URL and TEST_DATABASE_URL too).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates mandate_test for the integration test (TEST_DATABASE_URL), which wipes its database.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
