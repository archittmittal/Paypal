name: Secret scan

# Hard rule 7: no secrets in git. Scans the commits a PR or push adds for real, verified credentials
# (PayPal, Anthropic, cloud keys, ...). Complements GitHub secret scanning push protection.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          # The action otherwise runs the "latest" Docker image, so pinning the action alone does not pin the
          # scanner. Keep this in step with the tag in the comment above.
          version: 3.99.2
          # --results=verified,unknown also fails on keys TruffleHog could not check, not only live ones.
          extra_args: --results=verified,unknown
