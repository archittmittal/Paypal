name: PR title

# Squash merges use the PR title as the commit message, so it must follow Conventional Commits
# (CLAUDE.md, Git workflow): e.g. "feat(policy): block split purchases".

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads only the PR title via the API; never checks out or runs PR code, which keeps
      # pull_request_target safe for PRs from forks.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            test
            eval
            ci
            refactor
            perf
            build
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter, e.g. "feat(api): add health check".
