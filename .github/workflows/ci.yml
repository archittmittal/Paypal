name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres for apps/api/test/postgres.integration.test.ts (concurrent budget reservations).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mandate
          POSTGRES_PASSWORD: mandate
          POSTGRES_DB: mandate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mandate -d mandate_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mandate:mandate@localhost:5432/mandate_test
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Offline smoke only. The live smoke needs an API key and never runs in CI.
      - run: pnpm smoke:offline
